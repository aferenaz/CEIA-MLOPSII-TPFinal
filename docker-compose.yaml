# Gout MLOps — pronóstico de demanda
# Uso:  docker compose --profile all up -d --build
#       docker compose --profile streaming up -d   (productor/consumidor, requiere modelo en prod)

x-common-env: &common-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_S3_ENDPOINT_URL: http://s3:9000
  AWS_ENDPOINT_URL_S3: http://s3:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minio123}
  GOUT_DB_URL: postgresql+psycopg2://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres:5432/gout_db
  DATA_REPO_BUCKET_NAME: ${DATA_REPO_BUCKET_NAME:-data}
  MODEL_NAME: ${MODEL_NAME:-gout_demand_model}
  MODEL_ALIAS: ${MODEL_ALIAS:-prod}
  API_URL: http://api:8800

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: dockerfiles/airflow/Dockerfile
  image: ${AIRFLOW_IMAGE_NAME:-gout-airflow:latest}
  profiles: [all, airflow]
  environment:
    <<: *common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres:5432/${PG_DATABASE:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    REPORTS_BUCKET: ${DATA_REPO_BUCKET_NAME:-data}      # reportes HTML de drift
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./src/gout_common:/opt/airflow/gout_common_pkg/gout_common   # hot-reload del código compartido
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_healthy

services:
  # ------------------------------------------------------------------ base
  postgres:
    build:
      context: .
      dockerfile: dockerfiles/postgres/Dockerfile
    container_name: gout_postgres
    profiles: [all, airflow, mlflow, api, grpc, streaming]
    environment:
      POSTGRES_USER: ${PG_USER:-airflow}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-airflow}
      POSTGRES_DB: ${PG_DATABASE:-airflow}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_USER:-airflow}"]
      interval: 10s
      retries: 5
    restart: always

  s3:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: gout_minio
    profiles: [all, airflow, mlflow, api, grpc, streaming]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-minio123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_PORT_UI:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
    restart: always

  create_s3_buckets:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: gout_minio_init
    profiles: [all, airflow, mlflow, api, grpc, streaming]
    depends_on:
      s3:
        condition: service_healthy
    volumes:
      - ./data:/seed:ro   # pedidos_anon.csv / resumen_anon.csv (salida del notebook de anonimización)
    entrypoint: >
      /bin/sh -c "
      mc alias set s3 http://s3:9000 ${MINIO_ACCESS_KEY:-minio} ${MINIO_SECRET_ACCESS_KEY:-minio123} &&
      mc mb --ignore-existing s3/${MLFLOW_BUCKET_NAME:-mlflow} &&
      mc mb --ignore-existing s3/${DATA_REPO_BUCKET_NAME:-data} &&
      (ls /seed/*.csv >/dev/null 2>&1 && mc cp /seed/*.csv s3/${DATA_REPO_BUCKET_NAME:-data}/raw/ || echo 'Sin CSV en ./data') &&
      exit 0"

  mlflow:
    build:
      context: .
      dockerfile: dockerfiles/mlflow/Dockerfile
    container_name: gout_mlflow
    profiles: [all, airflow, mlflow, api, grpc, streaming]
    depends_on:
      postgres:
        condition: service_healthy
      create_s3_buckets:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minio123}
    # --serve-artifacts: los clientes suben/bajan artefactos vía MLflow; solo este servicio necesita credenciales de S3
    command: >
      mlflow server
      --backend-store-uri postgresql://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres:5432/mlflow_db
      --artifacts-destination s3://${MLFLOW_BUCKET_NAME:-mlflow}
      --serve-artifacts
      --host 0.0.0.0 --port 5000
    ports:
      - "${MLFLOW_PORT:-5005}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      retries: 10
      start_period: 20s
    restart: always

  # ------------------------------------------------------------------ airflow
  airflow-init:
    <<: *airflow-common
    container_name: gout_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-airflow}:${PG_PASSWORD:-airflow}@postgres:5432/${PG_DATABASE:-airflow}
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    volumes:
      - ./airflow:/sources
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: gout_airflow_webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: gout_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------ serving
  # S1 REST + S2 GraphQL en el mismo servicio (/predict y /graphql)
  api:
    build:
      context: .
      dockerfile: dockerfiles/api/Dockerfile
    container_name: gout_api
    profiles: [all, api]
    environment:
      <<: *common-env
    ports:
      - "${API_PORT:-8800}:8800"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/health')"]
      interval: 30s
      retries: 5
    restart: always

  # S3 gRPC
  grpc:
    build:
      context: .
      dockerfile: dockerfiles/grpc/Dockerfile
    container_name: gout_grpc
    profiles: [all, grpc, streaming]
    environment:
      <<: *common-env
      GRPC_PORT: 50051
    ports:
      - "${GRPC_PORT:-50051}:50051"
    depends_on:
      mlflow:
        condition: service_healthy
    restart: always

  # ------------------------------------------------------------------ S4 streaming
  kafka:
    image: apache/kafka:3.8.0
    container_name: gout_kafka
    profiles: [all, streaming]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT_EXTERNAL:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "${KAFKA_PORT_EXTERNAL:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      retries: 10
      start_period: 20s
    restart: always

  producer:
    build:
      context: .
      dockerfile: dockerfiles/streaming/Dockerfile
    container_name: gout_producer
    profiles: [streaming]
    command: ["python", "-m", "streaming.producer"]
    environment:
      <<: *common-env
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_VENTAS: ${KAFKA_TOPIC_VENTAS:-ventas_gout}
      REPLAY_DESDE: ${REPLAY_DESDE:-2025-06-01}
      REPLAY_HASTA: ${REPLAY_HASTA:-2025-06-30}
      REPLAY_PAUSA_S: ${REPLAY_PAUSA_S:-1}
    depends_on:
      kafka:
        condition: service_healthy
      consumer:
        condition: service_started

  consumer:
    build:
      context: .
      dockerfile: dockerfiles/streaming/Dockerfile
    container_name: gout_consumer
    profiles: [streaming]
    command: ["python", "-m", "streaming.consumer"]
    environment:
      <<: *common-env
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_VENTAS: ${KAFKA_TOPIC_VENTAS:-ventas_gout}
      KAFKA_TOPIC_ALERTAS: ${KAFKA_TOPIC_ALERTAS:-alertas_desvio}
      GRPC_TARGET: grpc:50051
      UMBRAL_ABS: ${UMBRAL_ABS:-4}
      UMBRAL_REL: ${UMBRAL_REL:-0.5}
    depends_on:
      kafka:
        condition: service_healthy
      grpc:
        condition: service_started

volumes:
  db_data:
  minio_data:
